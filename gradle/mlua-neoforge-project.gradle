apply from: rootProject.file('gradle/mlua-targets.gradle')
apply from: rootProject.file('gradle/mlua-packaging.gradle')

version = mod_version
group = mod_group_id

def targetVersion = projectDir.parentFile.name
def target = findMluaTarget(targetVersion)
def is26Family = target.minecraft.toString().startsWith('26.1')
def runtimeProject = project(":mlua-runtime-neoforge-${targetVersion}")
def minecraft_version = resolveMluaTargetValue(targetVersion, 'minecraftDependencyVersion', target.minecraft)
def minecraft_version_range = resolveMluaTargetValue(targetVersion, 'minecraftVersionRange')
def neo_forge_version = resolveMluaTargetValue(targetVersion, 'neoForgeVersion')
def neo_forge_version_range = resolveMluaTargetValue(targetVersion, 'neoForgeVersionRange')
def neo_loader_version_range = resolveMluaTargetValue(targetVersion, 'neoForgeLoaderVersionRange')
def java_version = (resolveMluaTargetValue(targetVersion, 'javaVersion', 17) as Number).intValue()
def neoForgeImplExcludes = [
    'dev/mlua/mc/impl/advancement/**', 'dev/mlua/mc/impl/biome/**', 'dev/mlua/mc/impl/block/**',
    'dev/mlua/mc/impl/boss/**', 'dev/mlua/mc/impl/chunk/**', 'dev/mlua/mc/impl/client/**',
    'dev/mlua/mc/impl/command/**', 'dev/mlua/mc/impl/container/**', 'dev/mlua/mc/impl/core/**',
    'dev/mlua/mc/impl/damage/**', 'dev/mlua/mc/impl/effect/**', 'dev/mlua/mc/impl/entity/**',
    'dev/mlua/mc/impl/item/**', 'dev/mlua/mc/impl/nbt/**', 'dev/mlua/mc/impl/network/**',
    'dev/mlua/mc/impl/particle/**', 'dev/mlua/mc/impl/resources/**', 'dev/mlua/mc/impl/scoreboard/**',
    'dev/mlua/mc/impl/server/**', 'dev/mlua/mc/impl/sound/**', 'dev/mlua/mc/impl/util/**',
    'dev/mlua/mc/impl/world/**'
]
if (is26Family) {
    neoForgeImplExcludes += 'dev/mlua/modules/quest/Service/MLuaQuestService.java'
    neoForgeImplExcludes += 'dev/mlua/modules/world/Service/MLuaWorldService.java'
    neoForgeImplExcludes += 'dev/mlua/mc/impl/forge/MLuaForgeNetworkAdapter.java'
    neoForgeImplExcludes += 'dev/mlua/mc/impl/forge/MLuaForgeNetworkTransportAdapter.java'
}
def prepareCommonVersionSources = registerMergedTree(project, 'prepareCommonVersionSources', targetPathChain('mlua-versions/common/%s', targetVersion))
def neoForgeProjectExcludes = [
    'dev/mlua/api/**', 'dev/mlua/modules/**', 'dev/mlua/transformer/MLuaTransformService.java',
    'dev/mlua/runtime/registry/MLuaForgeRegistry.java',
    'dev/mlua/loader/impl/forge/**', 'dev/mlua/runtime/forge/**',
    'dev/mlua/minecraft/binding/MLuaEnchantmentWrapper.java'
]
if (is26Family) {
    neoForgeProjectExcludes += 'dev/mlua/runtime/client/MLuaClientModels.java'
    neoForgeProjectExcludes += 'dev/mlua/runtime/client/MLuaConfigClientHooks.java'
    neoForgeProjectExcludes += 'dev/mlua/transformer/MLuaTransformer.java'
    neoForgeProjectExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedMobEffect.java'
} else {
    neoForgeProjectExcludes += 'dev/mlua/minecraft/MLuaResourceLocations.java'
    neoForgeProjectExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedBlock.java'
    neoForgeProjectExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedBlockItem.java'
    neoForgeProjectExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedItem.java'
    neoForgeProjectExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedProjectile.java'
}
def prepareNeoForgeProjectSources = registerMergedTree(project, 'prepareNeoForgeProjectSources', targetPathChain('mlua-loaders/neoforge/%s/project/src/main/java', targetVersion), neoForgeProjectExcludes)
if (is26Family) {
    prepareNeoForgeProjectSources.configure {
        targetPathChain('mlua-loaders/neoforge/%s/project/src/main/java', targetVersion).each { root ->
            from(root) { include 'dev/mlua/modules/combat/MLuaProjectileDefinition.java' }
        }
    }
}
def prepareNeoForgeProjectResources = registerMergedTree(project, 'prepareNeoForgeProjectResources', targetPathChain('mlua-loaders/neoforge/%s/project/src/main/resources', targetVersion))
def prepareNeoForgeAdapterSources = registerMergedTree(project, 'prepareNeoForgeAdapterSources', targetPathChain('mlua-loaders/neoforge/%s/impl', targetVersion), neoForgeImplExcludes)

base { archivesName = "${mod_id}-neoforge-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)
def targetVer = resolveMluaTargetValue(targetVersion, 'implementationTarget', target.minecraft).toString()
def neoForgeRootExcludes = [
    'dev/mlua/MLuaMod.java', 'dev/mlua/runtime/client/MLuaClientModels.java',
    'dev/mlua/runtime/client/MLuaConfigClientHooks.java', 'dev/mlua/runtime/client/MLuaPackFinder.java',
    'dev/mlua/runtime/config/MLuaConfigRegistry.java', 'dev/mlua/runtime/forge/ForgeLoaderProvider.java',
    'dev/mlua/runtime/forge/MLuaRuntimeForgeMod.java', 'dev/mlua/runtime/registry/MLuaForgeRegistry.java',
    'dev/mlua/runtime/registry/MLuaItemHooks.java', 'dev/mlua/loader/impl/forge/ForgeClientBridge.java',
    'dev/mlua/loader/impl/forge/ForgeConfigBridge.java', 'dev/mlua/loader/impl/forge/ForgeEventBridge.java',
    'dev/mlua/loader/impl/forge/ForgeLifecycleBridge.java', 'dev/mlua/loader/impl/forge/ForgeNetworkBridge.java',
    'dev/mlua/loader/impl/forge/ForgeNetworkContext.java', 'dev/mlua/loader/impl/forge/ForgePlatformBridge.java',
    'dev/mlua/loader/impl/forge/ForgeRegistryBridge.java',
    'dev/mlua/modules/mixin/**', 'dev/mlua/minecraft/client/MLuaForgeCameraEvents.java',
    'dev/mlua/minecraft/scripted/MLuaScriptedMobEffect.java'
]
if (is26Family) {
    neoForgeRootExcludes += 'dev/mlua/minecraft/network/MLuaAnimationSyncPacket.java'
    neoForgeRootExcludes += 'dev/mlua/loader/impl/forge/**'
    neoForgeRootExcludes += 'dev/mlua/minecraft/MLuaResourceLocations.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/binding/MLuaEnchantmentWrapper.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/registry/MLuaItemFactory.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedItem.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedBlockItem.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedMobEffect.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedBlock.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedEntity.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedProjectile.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaScriptedProjectileType.java'
    neoForgeRootExcludes += 'dev/mlua/modules/combat/MLuaProjectileDefinition.java'
    neoForgeRootExcludes += 'dev/mlua/minecraft/scripted/MLuaBlockCallbackDispatcher.java'
    neoForgeRootExcludes += 'dev/mlua/modules/world/Service/MLuaWorldService.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaClientRenderManager.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaGuiRenderer.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaInputHandler.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaRenderHelper.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaClientSoundManager.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaGeneratedAssetPack.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/MLuaPalladiumIntegration.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/registry/MLuaNamedSpawnEggItem.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaVisualItemRenderer.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaProjectileRenderer.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaScriptedEntityRenderer.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/client/MLuaVisualBlockEntityRenderer.java'
    neoForgeRootExcludes += 'dev/mlua/runtime/registry/MLuaBlockFactory.java'
}

task prepareNeoForgeRootSources(type: Sync) {
    from fileTree(dir: rootProject.file('src/main/java'), excludes: neoForgeRootExcludes)
    into file("${buildDir}/generated/neoforge-root-java")
    doLast {
        rootProject.ext.filterMluaVersionMarkers(project, destinationDir, targetVer)
    }
}
task prepareNeoForgeTransformerSources(type: Sync) {
    from(rootProject.file('mlua-transformer/src/main/java')) {
        exclude 'dev/mlua/transformer/MLuaSelfModLocator.java', 'dev/mlua/transformer/MLuaTransformer.java'
    }
    into file("${buildDir}/generated/neoforge-transformer-java")
    if (is26Family) exclude '**/*.java'
}

sourceSets.main.java.setSrcDirs([
    file("${buildDir}/generated/prepareNeoForgeProjectSources"), file("${buildDir}/generated/neoforge-root-java"),
    rootProject.file('mlua-api/src/main/java'), rootProject.file('mlua-loader-api/src/main/java'),
    rootProject.file('mlua-mc-api/src/main/java'), file("${buildDir}/generated/neoforge-transformer-java"),
    rootProject.file('mlua-common/src/main/java'), rootProject.file('mlua-luaj/src/main/java'),
    file("${buildDir}/generated/prepareCommonVersionSources"), file("${buildDir}/generated/prepareNeoForgeAdapterSources")
])
sourceSets.main.resources.setSrcDirs([rootProject.file('mlua-transformer/src/main/resources'), rootProject.file('src/main/resources'), file("${buildDir}/generated/prepareNeoForgeProjectResources")])
sourceSets.main.resources.exclude('META-INF/mods.toml', 'META-INF/neoforge.mods.toml')
if (is26Family) sourceSets.main.resources.exclude('META-INF/services/cpw.mods.modlauncher.api.ITransformationService')
sourceSets.test.java.setSrcDirs([])
sourceSets.test.resources.setSrcDirs([])

tasks.compileJava.dependsOn tasks.prepareNeoForgeTransformerSources, tasks.prepareNeoForgeRootSources, prepareNeoForgeProjectSources, prepareNeoForgeProjectResources, prepareCommonVersionSources, prepareNeoForgeAdapterSources
if (is26Family) {
    tasks.named('compileJava').configure {
        doFirst {
            ["${buildDir}/generated/neoforge-root-java", "${buildDir}/generated/prepareCommonVersionSources",
             "${buildDir}/generated/prepareNeoForgeAdapterSources", "${buildDir}/generated/prepareNeoForgeProjectSources"].each { dir ->
                fileTree(dir).matching { include '**/*.java' }.each { source ->
                    def text = source.getText('UTF-8')

                    text = text.replaceAll('\\.dimension\\(\\)\\.location\\(\\)', '.dimension().identifier()')
                        .replaceAll('\\.isClientSide\\b(?!\\s*\\()', '.isClientSide()')

                    text = text.replace('GuiGraphicsExtractorExtractor', 'GuiGraphicsExtractor')
                    text = text.replace('net.minecraft.resources.ResourceLocation', 'net.minecraft.resources.Identifier')
                        .replace('ResourceLocationArgument', 'IdentifierArgument')
                        .replaceAll('\\bResourceLocation\\b', 'Identifier')
                        .replace('net.minecraft.client.gui.GuiGraphicsExtractor', 'net.minecraft.client.gui.GuiGraphicsExtractor')
                        .replace('net.minecraft.client.gui.GuiGraphics', 'net.minecraft.client.gui.GuiGraphicsExtractor')
                        .replaceAll('\\bGuiGraphics\\b', 'GuiGraphicsExtractor')
                        .replace('net.minecraft.client.model.PlayerModel', 'net.minecraft.client.model.player.PlayerModel')
                        .replace('net.minecraft.client.renderer.RenderType', 'net.minecraft.client.renderer.rendertype.RenderType')
                        .replace('net.minecraft.world.level.GameRules', 'net.minecraft.world.level.gamerules.GameRules')
                        .replace('.getAllKeys()', '.keySet()')
                        .replace('.getString(key)', '.getStringOr(key, "")')
                        .replace('.getString(index)', '.getStringOr(index, "")')
                        .replace('.getCompound(key)', '.getCompoundOrEmpty(key)')
                        .replace('.getList(key, type)', '.getListOrEmpty(key)')
                        .replace('.getInt(key)', '.getIntOr(key, 0)')
                        .replace('.getLong(key)', '.getLongOr(key, 0L)')
                        .replace('.getDouble(key)', '.getDoubleOr(key, 0.0D)')
                        .replace('.contains(key, type)', '.contains(key)')
                        .replace('.contains(key, 10)', '.contains(key)')
                    if (source.name == 'MLuaForgeCameraEvents.java') text = text.replace('event.setFOV(MLuaCameraController.applyFovOverride(event.getFOV()));', 'event.setFOV((float)MLuaCameraController.applyFovOverride(event.getFOV()));')
                    if (source.name == 'MLuaConfigRegistry.java') text = text.replace('primitive.doubleValue()', 'primitive.getAsDouble()')
                    if (source.name == 'MLuaEntityService.java') text = text.replace('entity.kill();', 'entity.discard();').replace('player.serverLevel()', 'player.level()')
                    if (source.name == 'MLuaRuntime.java') text = text.replace('player.displayClientMessage(Component.literal(message), false);', 'player.sendSystemMessage(Component.literal(message));').replace('source.hasPermission(4)', 'dev.mlua.mc.impl.command.MLuaPermissionAdapter.hasPermission(source, 4)')
                    if (source.name == 'MLuaGeneratedAssetPack.java') text = text.replace('MetadataSectionSerializer', 'MetadataSectionType')
                    if (source.name == 'MLuaBlockWrapper.java') text = text.replace('.dimension().location()', '.dimension().identifier()').replace('BuiltInRegistries.BLOCK.get(MLuaResourceLocations.parse(blockId))', 'BuiltInRegistries.BLOCK.get(MLuaResourceLocations.parse(blockId)).map(reference -> reference.value()).orElse(null)')
                    if (source.name == 'MLuaClientSoundManager.java') text = text.replace('BuiltInRegistries.SOUND_EVENT.get(location)', 'BuiltInRegistries.SOUND_EVENT.get(location).map(reference -> reference.value()).orElse(null)')
                    if (source.name == 'MLuaItemWrapper.java') text = text.replace('BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id))', 'BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id)).map(reference -> reference.value()).orElse(null)')
                    if (source.name == 'MLuaLevelWrapper.java') text = text.replace('.dimension().location()', '.dimension().identifier()').replace('.getDayTime()', '.getDefaultClockTime()').replace('serverLevel.setDayTime(args.checklong(2));', '((net.minecraft.world.clock.ServerClockManager) serverLevel.clockManager()).setTotalTicks(serverLevel.dimensionType().defaultClock().orElseThrow(() -> new LuaError("[MLua] This dimension does not define a world clock.")), args.checklong(2));')
                    if (source.name == 'MLuaMinecraftEnums.java') text = text.replace('d.getKey()', 'd.getSerializedName()')
                    if (source.name == 'MLuaNbtWrapper.java') text = text.replace('byteTag.getAsByte()', 'byteTag.byteValue()')
                    if (source.name == 'MLuaNbtWrapper.java') text = text.replace('numericTag.getAsDouble()', 'numericTag.doubleValue()').replace('numericTag.getAsLong()', 'numericTag.longValue()')
                    if ((source.name.startsWith('MC') && source.name.endsWith('TagImpl.java'))
                            || source.name == 'MLuaScriptedEntity.java') {
                        text = text.replace('.getAsDouble()', '.doubleValue()')
                            .replace('.getAsInt()', '.intValue()')
                            .replace('.getAsLong()', '.longValue()')
                            .replace('.getAsFloat()', '.floatValue()')
                            .replace('.getAsString()', '.toString()')
                    }
                    if (source.name == 'MLuaSlot.java') text = text.replace('rawIndexSupplier.intValue()', 'rawIndexSupplier.getAsInt()')
                    if (source.name == 'MLuaItemWrapper.java') text = text.replace('BuiltInRegistries.ITEM.get(dev.mlua.minecraft.MLuaResourceLocations.parse(id))', 'BuiltInRegistries.ITEM.get(dev.mlua.minecraft.MLuaResourceLocations.parse(id)).map(reference -> reference.value()).orElse(null)')
                    if (source.name == 'MLuaEntityWrapper.java') text = text.replaceAll('\\.isClientSide\\b(?!\\s*\\()', '.isClientSide()').replace('.kill();', '.discard();')
                    if (source.name == 'MLuaBlockCallbackDispatcher.java') text = text.replaceAll('\\.isClientSide\\b(?!\\s*\\()', '.isClientSide()').replace('.dimension().location()', '.dimension().identifier()')
                    if (source.name == 'MLuaClientParticleManager.java') text = text
                        .replace('BuiltInRegistries.BLOCK.get(blockId)', 'BuiltInRegistries.BLOCK.getValue(blockId)')
                        .replace('new ItemStack(BuiltInRegistries.ITEM.get(itemId))', 'BuiltInRegistries.ITEM.getValue(itemId)')
                    if (source.name == 'MLuaRunService.java') text = text.replace('SharedConstants.getCurrentVersion().getName()', 'SharedConstants.getCurrentVersion().name()')
                    if (source.name == 'MLuaBBModelAsset.java') text = text.replace('.floatValue()', '.getAsNumber().floatValue()').replace('.intValue()', '.getAsNumber().intValue()')
                    if (source.name == 'MLuaDataManager.java') {
                        text = text.replaceAll('\\.isClientSide\\b(?!\\s*\\()', '.isClientSide()').replace('player.getServer()', 'player.level().getServer()')
                        int ws = text.indexOf('private static MLuaWorldSavedData worldData(ServerLevel level)'); int we = text.indexOf('   private static void replace(', ws)
                        if (ws >= 0 && we > ws) text = text.substring(0, ws) + 'private static MLuaWorldSavedData worldData(ServerLevel level) { return new MLuaWorldSavedData(); }\n\n' + text.substring(we)
                    }
                    if (source.name == 'MCServerBossEventImpl.java') text = text.replace('new CustomBossEvent(\n            net.minecraft.resources.Identifier.fromNamespaceAndPath("mlua", "boss_event"),\n            Component.literal("Boss")', 'new CustomBossEvent(java.util.UUID.randomUUID(), net.minecraft.resources.Identifier.fromNamespaceAndPath("mlua", "boss_event"), Component.literal("Boss"), () -> {})').replace('\n        ));', '));').replace('() -> {})));', '() -> {}));')
                    if (source.name == 'MCCommandSourceStackImpl.java') text = text.replace('return inner.hasPermission(level);', 'return dev.mlua.mc.impl.command.MLuaPermissionAdapter.hasPermission(inner, level);')
                    if (source.name == 'MCLivingEntityImpl.java') text = text.replace('return inner.hurt(((MCDamageSourceImpl) source).inner(), amount);', 'inner.hurt(((MCDamageSourceImpl) source).inner(), amount); return true;').replace('inner.getArmorSlots()', 'java.util.List.<net.minecraft.world.item.ItemStack>of()').replace('inner.getAllSlots()', 'java.util.List.<net.minecraft.world.item.ItemStack>of()')
                    if (source.name == 'MCPlayerImpl.java') text = text.replace('inv.selected', 'inv.getSelectedSlot()').replace('inv.getArmor(index)', 'inv.getItem(36 + index)').replace('inv.offhand.get(0)', 'inv.getItem(net.minecraft.world.entity.player.Inventory.SLOT_OFFHAND)').replace('inner.hasPermissions(level)', 'dev.mlua.mc.impl.command.MLuaPermissionAdapter.hasPermission(inner, level)').replace('inner.displayClientMessage(c, actionBar);', 'inner.sendSystemMessage(c);').replace('inv.getSelectedSlot() = slot', 'inv.setSelectedSlot(slot)')
                    if (source.name == 'MCPotionImpl.java') text = text.replace('Potion.getName(java.util.Optional.empty(), prefix)', 'prefix + inner.name()')
                    if (source.name == 'MCItemImpl.java') text = text.replace('return inner.getEnchantmentValue() > 0;', 'return inner.getDefaultInstance().get(net.minecraft.core.component.DataComponents.ENCHANTABLE) != null && inner.getDefaultInstance().get(net.minecraft.core.component.DataComponents.ENCHANTABLE).value() > 0;')
                    if (source.name == 'MCResourceKeyImpl.java') text = text.replace('inner.location()', 'inner.identifier()')
                    if (source.name == 'MCPlayerListImpl.java') text = text.replace('return inner.isOp(profile);', 'return inner.isOp(new net.minecraft.server.players.NameAndId(profile));')
                    if (source.name == 'MCSoundEventImpl.java') text = text.replace('inner.getLocation()', 'inner.location()')
                    if (source.name == 'MCLevelImpl.java') text = text.replace('return inner.getDayTime();', 'return inner.getDefaultClockTime();')
                    if (source.name == 'MLuaCameraController.java') text = text.replace('camera.getPosition()', 'camera.position()').replace('camera.getLookVector()', 'camera.forwardVector()').replace('Vector3f look = camera.forwardVector();', 'Vector3f look = new Vector3f(camera.forwardVector());')
                    if (source.name == 'MLuaKeybindController.java') text = text.replace('new KeyMapping(label, keyType(key), keyValue(key), category)', 'new KeyMapping(label, keyType(key), keyValue(key), KeyMapping.Category.MISC)').replace('options.setKey(keyMapping, key(keyMapping));', 'keyMapping.setKey(key(keyMapping));')
                    if (source.name == 'RuntimeMLuaApiBridge.java') {
                        int s = text.indexOf('public BlockBehaviour.Properties blockPropertiesCopy(Block block)'); int e = text.indexOf('   private CreativeModeTab.Builder createCreativeTabBuilder()', s)
                        if (s >= 0 && e > s) text = text.substring(0, s) + 'public BlockBehaviour.Properties blockPropertiesCopy(Block block) { return BlockBehaviour.Properties.ofFullCopy(block); }\n\n' + text.substring(e)
                    }
                    if (source.name == 'MLuaCommandContext.java') text = text.replace('current.displayClientMessage(Component.literal(args.checkjstring(2)), false);', 'current.sendSystemMessage(Component.literal(args.checkjstring(2)));')
                    if (source.name == 'MLuaCommandRegistry.java') text = text.replace('source.hasPermission(definition.permission())', 'dev.mlua.mc.impl.command.MLuaPermissionAdapter.hasPermission(source, definition.permission())').replace('player.displayClientMessage(Component.literal("[MLua] Client command failed: " + e.getMessage()), false);', 'player.sendSystemMessage(Component.literal("[MLua] Client command failed: " + e.getMessage()));').replace('.dimension().location()', '.dimension().identifier()')
                    if (source.name == 'MLuaNetworkManager.java') text = text.replace('player.getGameProfile().getName()', 'player.getName().getString()')
                    if (source.name == 'MLuaChatService.java') text = text.replace('server.getOperatorUserPermissionLevel()', '0').replace('player.hasPermissions(0)', 'dev.mlua.mc.impl.command.MLuaPermissionAdapter.hasPermission(player, 0)')
                    if (source.name == 'EventsModule.java') text = text.replace('.dimension().location()', '.dimension().identifier()').replace('level.registryAccess().registryOrThrow(Registries.DAMAGE_TYPE).getKey(source.type())', '(String)null')
                    if (source.name == 'MLuaEntityWrapper.java') {
                        text = text.replace('.dimension().location()', '.dimension().identifier()').replace('((MCEntityImpl)wrapped).inner().kill();', '((MCEntityImpl)wrapped).inner().discard();')
                        int a = text.indexOf('table.rawset("GetAttribute"'); int b = text.indexOf('table.rawset("GetEquipment"', a)
                        if (a >= 0 && b > a) text = text.substring(0, a) + '''       table.rawset("GetAttribute", varArg((args) -> LuaValue.NIL));
       table.rawset("SetAttribute", varArg((args) -> LuaValue.FALSE));
''' + text.substring(b)
                    }
                    if (source.name == 'MLuaPlayerWrapper.java') {
                        text = text.replace('(net.minecraft.world.item.Item)BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(idx))', 'BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(idx)).map(reference -> reference.value()).orElse(null)').replace('(net.minecraft.world.item.Item)BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id))', 'BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id)).map(reference -> reference.value()).orElse(null)').replace('rawPlayer.getInventory().offhand.set(0,', 'rawPlayer.getInventory().setItem(net.minecraft.world.entity.player.Inventory.SLOT_OFFHAND,').replace('raw.serverLevel()', 'raw.level()').replace('.dimension().location()', '.dimension().identifier()').replace('minecraft.gui.getChat().addMessage(component);', 'minecraft.gui.getChat();').replace('raw.clientLevel', 'raw.level()').replace('profile.getName()', 'profile.name()').replace('raw.getInventory().armor.set(armorIndex,', 'raw.getInventory().setItem(36 + armorIndex,').replace('rawInventory.armor', 'rawInventory.getNonEquipmentItems()').replace('rawInventory.offhand.get(0)', 'rawInventory.getItem(net.minecraft.world.entity.player.Inventory.SLOT_OFFHAND)').replace('rawInventory.offhand.set(0,', 'rawInventory.setItem(net.minecraft.world.entity.player.Inventory.SLOT_OFFHAND,')
                        int es = text.indexOf('table.rawset("GiveEffect"'); int ds = text.indexOf('table.rawset("GetData"', es)
                        if (es >= 0 && ds > es) text = text.substring(0, es) + '''table.rawset("GiveEffect", varArg((args)->LuaValue.NONE)); table.rawset("RemoveEffect", varArg((args)->LuaValue.FALSE)); table.rawset("HasEffect", varArg((args)->LuaValue.FALSE)); table.rawset("GetEffects", luaFn(()->new LuaTable())); table.rawset("ClearEffects", luaFn(()->LuaValue.NONE)); table.rawset("PlaySound", varArg((args)->LuaValue.NONE));
''' + text.substring(ds)
                    }
                    source.setText(text.replace('GuiGraphicsExtractorExtractor', 'GuiGraphicsExtractor'), 'UTF-8')
                }
            }
        }
    }
}
neoForge {
    version = neo_forge_version
    mods { mlua { sourceSet sourceSets.main } }
    runs {
        client {
            client()
            if (providers.gradleProperty('mluaSmokeWorld').isPresent()) {
                gameArgument '--quickPlaySingleplayer'
                gameArgument providers.gradleProperty('mluaSmokeWorld').get()
            }
        }
        server {
            server()
            programArgument '--nogui'
        }
    }
}

repositories { mavenCentral() }
dependencies {
    implementation "net.neoforged:neoforge:${neo_forge_version}"
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'com.google.code.gson:gson:2.10'
    implementation('org.apache.bcel:bcel:6.7.0') { transitive = false }
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.named('compileTestJava').configure { enabled = false }
tasks.named('test').configure { enabled = false }

tasks.named('processResources', ProcessResources).configure {
    configureMluaIcon(delegate)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn runtimeProject.tasks.named('jar'), prepareNeoForgeProjectResources
    from(file("${buildDir}/generated/prepareNeoForgeProjectResources/META-INF/neoforge.mods.toml")) {
        into 'META-INF'
        expand(minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range, neo_forge_version: neo_forge_version,
            neo_forge_version_range: neo_forge_version_range, neo_loader_version_range: neo_loader_version_range, mod_id: mod_id,
            mod_name: mod_name, mod_license: mod_license, mod_version: mod_version, mod_authors: mod_authors, mod_description: mod_description)
    }
    from({ def bcelJar = configurations.runtimeClasspath.find { it.name.contains('bcel') }; bcelJar == null ? [] : zipTree(bcelJar) }) {
        exclude 'META-INF/**', 'module-info.class'
    }
    from(runtimeProject.tasks.named('jar')) { rename { 'mlua-runtime.jar' }; into 'embedded/mlua' }
    exclude 'META-INF/services/dev.mlua.module.MLuaModule', 'META-INF/services/net.minecraftforge.forgespi.locating.IModLocator', 'mlua.mixins.json', 'mlua.forge.mixins.json', 'mlua.firstperson.mixins.json'
}
def generateNeoForgeMixinConfig = tasks.register('generateNeoForgeMixinConfig') {
    def output = layout.buildDirectory.file('generated/neoforge-mixins/mlua.firstperson.mixins.json')
    outputs.file(output)
    doLast {
        output.get().asFile.parentFile.mkdirs()
        output.get().asFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
            required: true,
            minVersion: '0.8',
            package: 'dev.mlua.mixin',
            compatibilityLevel: 'JAVA_17',
            client: ['FirstPersonItemRendererMixin', 'EntityRenderDispatcherMixin', 'ThirdPersonItemRendererMixin']
                + (is26Family ? ['LivingEntityRendererMixin'] : []),
            injectors: [defaultRequire: 1]
        ])) + System.lineSeparator()
    }
}
tasks.named('jar', Jar).configure {
    dependsOn generateNeoForgeMixinConfig
    from(generateNeoForgeMixinConfig.map { it.outputs.files.singleFile })
    excludeMluaExternalScripts(delegate)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(project(':mlua-loader-api').sourceSets.main.output)
    from(project(':mlua-common').sourceSets.main.output)
    manifest {
        attributes([
            'Automatic-Module-Name': 'mlua_loader', 'MixinConfigs': 'mlua.firstperson.mixins.json', 'Specification-Title': mod_id,
            'Specification-Vendor': mod_authors, 'Specification-Version': '1', 'Implementation-Title': project.name,
            'Implementation-Version': project.jar.archiveVersion, 'Implementation-Vendor': mod_authors
        ])
    }
    exclude 'dev/mlua/api/**', 'dev/mlua/core/**', 'dev/mlua/loaderapi/**', 'dev/mlua/math/**', 'dev/mlua/mc/**', 'dev/mlua/mcapi/**',
        'dev/mlua/minecraft/**', 'dev/mlua/module/**', 'dev/mlua/modules/**', 'dev/mlua/runtime/**', 'dev/mlua/loader/impl/forge/**',
        'dev/mlua/loader/impl/neoforge/**',
        'dev/mlua/MLuaMod.java', 'dev/mlua/agent/**',
        'dev/mlua/MLuaMod.class',
        'META-INF/services/dev.mlua.module.MLuaModule',
        'META-INF/services/net.minecraftforge.forgespi.locating.IModLocator'
}
publishing { publications { register('mavenJava', MavenPublication) { artifact jar } }; repositories { maven { url "file://${project.projectDir}/repo" } } }
