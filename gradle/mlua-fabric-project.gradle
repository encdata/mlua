                    source.setText(text.replace('GuiGraphicsExtractorExtractor', 'GuiGraphicsExtractor').replace('isClientSide()()', 'isClientSide()'), 'UTF-8')
                }
            }
        }
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!isUnobfuscated) mappings loom.officialMojangMappings()
    if (isUnobfuscated) {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        // Keep the loader/API visible as Fabric mods in dedicated-server
        // DevLaunch even when official-mapped targets use plain implementation
        // dependencies for compilation.
        runtimeOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
        runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        // Loom's dedicated-server launch configuration does not always inherit
        // modImplementation dependencies when the project is launched directly.
        // Keep Fabric API on the server runtime classpath explicitly.
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'com.google.code.gson:gson:2.10'
    if (!isUnobfuscated) compileOnly project(':mlua-api')
    compileOnly project(':mlua-loader-api')
    compileOnly project(':mlua-mc-api')
    compileOnly project(':mlua-common')
    compileOnly project(':mlua-luaj')
    implementation('org.apache.bcel:bcel:6.7.0')
    include('org.apache.bcel:bcel:6.7.0')
}

// Fabric's dedicated-server DevLaunch must receive loader/API jars as
// explicit mod candidates. This is needed for every version target because
// Loom does not reliably propagate modRuntimeOnly into runServer.
tasks.withType(JavaExec).configureEach {
    if (name.toLowerCase().contains('run')) {
        doFirst {
            def remapClasspath = file('.gradle/loom-cache/remapClasspath.txt')
            def mods = remapClasspath.isFile() ? remapClasspath.getText('UTF-8')
                .split(java.util.regex.Pattern.quote(File.pathSeparator))
                .findAll { path ->
                    def normalized = path.replace('\\', '/')
                    normalized.contains('/net.fabricmc/fabric-loader/') || normalized.contains('/net.fabricmc.fabric-api/')
                }
                .join(File.pathSeparator) : ''
            if (mods.isBlank()) {
                def runtime = configurations.findByName('runtimeClasspath')
                if (runtime != null) {
                    mods = runtime.files
                        .findAll { file ->
                            def normalized = file.absolutePath.replace('\\', '/')
                            normalized.contains('/net.fabricmc/fabric-loader/') || normalized.contains('/net.fabricmc.fabric-api/')
                        }
                        .collect { it.absolutePath }
                        .join(File.pathSeparator)
                }
            }
            if (!mods.isBlank()) {
                systemProperty 'fabric.addMods', mods
                jvmArgs "-Dfabric.addMods=${mods}"
            }
        }
    }
}

// Also put the value on Loom's run configuration itself. Fabric Loom 1.8.x
// builds the DevLaunch command from this model and can ignore late JavaExec
// mutations for runServer.
def fabricServerModCandidates = providers.provider {
    def remapClasspath = file('.gradle/loom-cache/remapClasspath.txt')
    if (!remapClasspath.isFile()) return ''
    remapClasspath.getText('UTF-8')
        .split(java.util.regex.Pattern.quote(File.pathSeparator))
        .findAll { path ->
            def normalized = path.replace('\\', '/')
            normalized.contains('/net.fabricmc/fabric-loader/') || normalized.contains('/net.fabricmc.fabric-api/')
        }
        .join(File.pathSeparator)
}

loom.runs {
    server {
        def mods = fabricServerModCandidates.get()
        if (!mods.isBlank()) vmArg("-Dfabric.addMods=${mods}")
    }
}

processResources {
    configureMluaIcon(delegate)
    inputs.properties([
        version: project.version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_authors: mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version
    ])
    from("${rootProject.projectDir}/src/main/resources") {
        exclude 'META-INF/mods.toml'
        exclude 'mlua.mixins.json'
        exclude 'Icon.png'
    }
    filesMatching('fabric.mod.json') {
        expand(version: project.version, mod_id: mod_id, mod_name: mod_name,
            mod_authors: mod_authors, mod_description: mod_description,
            mod_license: mod_license,
            minecraft_version: minecraft_version)
    }
}
