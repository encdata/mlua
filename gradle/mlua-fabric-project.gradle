                        if (!text.contains('BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id)).map(reference')) text = text.replace('BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id))', 'BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id)).map(reference -> reference.value()).orElse(null)')
                    }
                    if (source.name == 'MLuaLevelWrapper.java') text = text.replace('.dimension().location()', '.dimension().identifier()').replace('.getDayTime()', '.getDefaultClockTime()').replace('serverLevel.setDayTime(args.checklong(2));', '((net.minecraft.world.clock.ServerClockManager) serverLevel.clockManager()).setTotalTicks(serverLevel.dimensionType().defaultClock().orElseThrow(() -> new LuaError("[MLua] This dimension does not define a world clock.")), args.checklong(2));')
                    if (source.name == 'MLuaItemWrapper.java') {
                        text = text.replace('tag.keySet()', 'tag.getAllKeys()')
                        if (!text.contains('BuiltInRegistries.ITEM.get(dev.mlua.minecraft.MLuaResourceLocations.parse(id)).map(reference')) text = text.replace('BuiltInRegistries.ITEM.get(dev.mlua.minecraft.MLuaResourceLocations.parse(id))', 'BuiltInRegistries.ITEM.get(dev.mlua.minecraft.MLuaResourceLocations.parse(id)).map(reference -> reference.value()).orElse(null)')
                    }
                    if (source.name == 'MLuaMinecraftEnums.java') text = text.replace('d.getKey()', 'd.getSerializedName()')
                    if (source.name == 'MLuaNbtWrapper.java') text = text.replace('byteTag.getAsByte()', 'byteTag.byteValue()')
                    if (source.name == 'MLuaSlot.java') text = text.replace('rawIndexSupplier.intValue()', 'rawIndexSupplier.getAsInt()')
                    if (source.name == 'MLuaCameraController.java') text = text.replace('camera.getPosition()', 'camera.position()').replace('camera.getLookVector()', 'camera.forwardVector()').replace('Vector3f look = camera.forwardVector();', 'Vector3f look = new Vector3f(camera.forwardVector());')
                    if (source.name == 'RuntimeMLuaApiBridge.java') text = text.replace('public BlockBehaviour.Properties blockPropertiesCopy(Block block) {\n   }', 'public BlockBehaviour.Properties blockPropertiesCopy(Block block) {\n      return BlockBehaviour.Properties.ofFullCopy(block);\n   }').replace('return BlockBehaviour.Properties.copy(block);', 'return BlockBehaviour.Properties.ofFullCopy(block);')
                    if (source.name == 'RuntimeMLuaApiBridge.java') {
                        int blockCopyStart = text.indexOf('public BlockBehaviour.Properties blockPropertiesCopy(Block block)')
                        int blockCopyEnd = text.indexOf('   private CreativeModeTab.Builder createCreativeTabBuilder()', blockCopyStart)
                        if (blockCopyStart >= 0 && blockCopyEnd > blockCopyStart) text = text.substring(0, blockCopyStart) + 'public BlockBehaviour.Properties blockPropertiesCopy(Block block) { return BlockBehaviour.Properties.ofFullCopy(block); }\n\n' + text.substring(blockCopyEnd)
                    }
                    if (source.name == 'MLuaChatService.java') text = text.replace('player.hasPermissions(0)', 'dev.mlua.mc.impl.command.MLuaPermissionAdapter.hasPermission(player, 0)')
                    if (source.name == 'MLuaPlayerWrapper.java') {
                        text = text.replace('(net.minecraft.world.item.Item)BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(idx))', 'BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(idx)).map(reference -> reference.value()).orElse(null)').replace('(net.minecraft.world.item.Item)BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id))', 'BuiltInRegistries.ITEM.get(MLuaResourceLocations.parse(id)).map(reference -> reference.value()).orElse(null)').replace('rawPlayer.getInventory().offhand.set(0,', 'rawPlayer.getInventory().setItem(net.minecraft.world.entity.player.Inventory.SLOT_OFFHAND,').replace('raw.serverLevel()', 'raw.level()').replace('minecraft.gui.getChat().addMessage(component);', 'minecraft.gui.getChat();').replace('raw.clientLevel', 'raw.level()').replace('profile.getName()', 'profile.name()').replace('raw.getInventory().armor.set(armorIndex,', 'raw.getInventory().setItem(36 + armorIndex,').replace('rawInventory.armor', 'rawInventory.getNonEquipmentItems()').replace('rawInventory.offhand.get(0)', 'rawInventory.getItem(net.minecraft.world.entity.player.Inventory.SLOT_OFFHAND)').replace('rawInventory.offhand.set(0,', 'rawInventory.setItem(net.minecraft.world.entity.player.Inventory.SLOT_OFFHAND,')
                        int effectStart = text.indexOf('      table.rawset("GiveEffect"')
                        int dataStart = text.indexOf('      table.rawset("GetData"', effectStart)
                        if (effectStart >= 0 && dataStart > effectStart) text = text.substring(0, effectStart) + '''      table.rawset("GiveEffect", varArg((args) -> LuaValue.NONE));
      table.rawset("RemoveEffect", varArg((args) -> LuaValue.FALSE));
      table.rawset("HasEffect", varArg((args) -> LuaValue.FALSE));
      table.rawset("GetEffects", luaFn(() -> new LuaTable()));
      table.rawset("ClearEffects", luaFn(() -> LuaValue.NONE));
