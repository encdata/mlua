                    if (source.name == 'EventsModule.java') text = text.replace('level.registryAccess().registryOrThrow(Registries.DAMAGE_TYPE).getKey(source.type())', '(String) null')
                    if (source.name == 'MCServerBossEventImpl.java') text = text.replace('java.util.UUID.randomUUID(), java.util.UUID.randomUUID(),', 'java.util.UUID.randomUUID(),').replace('Component.literal("Boss"), () -> {}, () -> {}', 'Component.literal("Boss"), () -> {}')
                    if (source.name == 'MLuaClientParticleManager.java') text = text
                        .replace('BuiltInRegistries.BLOCK.get(blockId)', 'BuiltInRegistries.BLOCK.getValue(blockId)')
                        .replace('new ItemStack(BuiltInRegistries.ITEM.get(itemId))', 'BuiltInRegistries.ITEM.getValue(itemId)')
                    if (source.name == 'MLuaBBModelAsset.java') text = text.replaceAll('(?<!getAsNumber\\(\\))\\.floatValue\\(\\)', '.getAsNumber().floatValue()').replaceAll('(?<!getAsNumber\\(\\))\\.intValue\\(\\)', '.getAsNumber().intValue()')
                    if (source.name == 'MLuaConfigRegistry.java') text = text.replace('primitive.doubleValue()', 'primitive.getAsDouble()')
                    if (source.name == 'MLuaDataManager.java') text = text.replace('.isClientSide', '.isClientSide()').replace('player.getServer()', 'player.level().getServer()')
                    text = text.replace('.isClientSide', '.isClientSide()')
                    if (source.name == 'MLuaDataManager.java') {
                        int wdStart = text.indexOf('private static MLuaWorldSavedData worldData(ServerLevel level)')
                        int wdEnd = text.indexOf('   private static void replace(', wdStart)
                        if (wdStart >= 0 && wdEnd > wdStart) text = text.substring(0, wdStart) + 'private static MLuaWorldSavedData worldData(ServerLevel level) { return new MLuaWorldSavedData(); }\n\n' + text.substring(wdEnd)
