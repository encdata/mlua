apply from: rootProject.file('gradle/mlua-targets.gradle')
apply from: rootProject.file('gradle/mlua-packaging.gradle')

version = mod_version
group = mod_group_id

def targetVersion = projectDir.parentFile.name
def target = findMluaTarget(targetVersion)
def is26Family = target.minecraft.toString().startsWith('26.1')
def minecraft_version = resolveMluaTargetValue(targetVersion, 'minecraftDependencyVersion', target.minecraft)
def fabric_loader_version = resolveMluaTargetValue(targetVersion, 'fabricLoaderVersion')
def fabric_api_version = resolveMluaTargetValue(targetVersion, 'fabricApiVersion')
def java_version = (resolveMluaTargetValue(targetVersion, 'javaVersion', 17) as Number).intValue()
def isUnobfuscated = is26Family
def prepareFabricCommonVersionSources = registerMergedTree(project, 'prepareFabricCommonVersionSources',
    commonVersionPathChain(targetVersion))
// The shared world service owns the Lua API for legacy targets. The old
// Fabric implementation duplicated that service and had already drifted from
// the shared entity resolver and world API components.
def fabricImplExcludes = [
    'dev/mlua/modules/world/service/MLuaWorldService.java'
]
if (is26Family) {
    fabricImplExcludes += 'dev/mlua/modules/mixin/service/BlockItemMixin.java'
}
def prepareFabricImplSources = registerMergedTree(project, 'prepareFabricImplSources',
    targetCommonLoaderPathChain('modules/loaders/common/%s/impl', 'modules/loaders/fabric/%s/impl', targetVersion),
    fabricImplExcludes)
def prepareFabricProjectSources = registerMergedTree(project, 'prepareFabricProjectSources',
    targetCommonLoaderPathChain('modules/loaders/common/%s/project/src/main/java',
        'modules/loaders/fabric/%s/project/src/main/java', targetVersion))
def prepareFabricProjectResources = registerMergedTree(project, 'prepareFabricProjectResources',
    targetPathChain('modules/loaders/fabric/%s/project/src/main/resources', targetVersion))

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

base {
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

sourceSets.main.resources.setSrcDirs([file("${buildDir}/generated/prepareFabricProjectResources")])

loom {
    mods {
        mlua {
            sourceSet sourceSets.main
        }
    }
}

def sharedManifest = {
    attributes(
        'Agent-Class': 'dev.mlua.agent.MLuaMixinAgent',
        'Premain-Class': 'dev.mlua.agent.MLuaMixinAgent',
        'Can-Retransform-Classes': 'true'
    )
}

jar {
    excludeMluaExternalScripts(delegate)
    manifest sharedManifest
    from({ configurations.runtimeClasspath.findAll { it.name == 'bcel-6.7.0.jar' || it.name == 'commons-lang3-3.18.0.jar' } }) {
        into 'META-INF/jars'
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

if (!isUnobfuscated) {
    remapJar {
        manifest sharedManifest
        from({ configurations.runtimeClasspath.findAll { it.name == 'bcel-6.7.0.jar' || it.name == 'commons-lang3-3.18.0.jar' } }) {
            into 'META-INF/jars'
            duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        }
    }
}

def rootExcludes = [
    'dev/mlua/MLuaMod.java',
    'dev/mlua/loader/impl/forge/**',
    'dev/mlua/minecraft/client/MLuaForgeCameraEvents.java',
    'dev/mlua/runtime/client/MLuaPackFinder.java',
    'dev/mlua/runtime/client/MLuaConfigClientHooks.java',
    'dev/mlua/runtime/client/MLuaClientModels.java',
    'dev/mlua/runtime/forge/**',
    'dev/mlua/runtime/registry/MLuaForgeRegistry.java',
    'dev/mlua/runtime/registry/MLuaForgeDeferredRegisters.java',
    'dev/mlua/modules/mixin/service/HumanoidModelMixin.java',
]
if (is26Family) {
    // 26.1 has its own Minecraft API implementation under modules/minecraft/mlua-versions.
    rootExcludes += 'dev/mlua/modules/world/service/MLuaWorldService.java'
}
if (isUnobfuscated) {
    // The 26.x camera path has loader-specific invokers and hooks. Older Fabric
    // targets use the shared implementations from src/main/java.
    rootExcludes += 'dev/mlua/modules/mixin/service/CameraInvoker.java'
    rootExcludes += 'dev/mlua/modules/mixin/service/CameraMixin.java'

    rootExcludes += 'dev/mlua/modules/mixin/service/PlayerModelMixin.java'
    rootExcludes += 'dev/mlua/modules/mixin/service/PlayerModelRenderMixin.java'
    rootExcludes += 'dev/mlua/minecraft/MLuaResourceLocations.java'
    rootExcludes += 'dev/mlua/runtime/registry/MLuaBlockFactory.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaProjectileRenderer.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaScriptedEntityRenderer.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaVisualBlockEntityRenderer.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaVisualItemRenderer.java'
    rootExcludes += 'dev/mlua/modules/combat/MLuaProjectileDefinition.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaClientRenderManager.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaHudObjectRenderer.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaWorldOverlayRenderer.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaGuiRenderer.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaInputHandler.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaRenderHelper.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaClientSoundManager.java'
    rootExcludes += 'dev/mlua/runtime/client/MLuaGeneratedAssetPack.java'
    rootExcludes += 'dev/mlua/runtime/MLuaPalladiumIntegration.java'
    rootExcludes += 'dev/mlua/runtime/registry/MLuaNamedSpawnEggItem.java'
}
if (is26Family) {
    rootExcludes += 'dev/mlua/modules/mixin/service/LivingEntityRendererMixin.java'
    rootExcludes += 'dev/mlua/modules/mixin/service/ThirdPersonItemRendererMixin.java'
    rootExcludes += 'dev/mlua/modules/mixin/service/EntityRenderDispatcherMixin.java'
    rootExcludes += 'dev/mlua/modules/mixin/service/ModelPartMixin.java'
}
def targetVer = resolveMluaTargetValue(targetVersion, 'implementationTarget', target.minecraft).toString()
rootExcludes += rootProject.ext.commonVersionRootExcludes(targetVersion)

task prepareRootSources(type: Sync) {
    inputs.property('mluaTargetVersion', targetVer)
    inputs.property('mluaRootExcludes', rootExcludes.join('\n'))
    from fileTree(dir: "${rootProject.projectDir}/src/main/java", excludes: rootExcludes + rootProject.ext.mluaCoreRuntimeSources)
    from(fileTree(dir: rootProject.file('modules/language/mlua-core/src/main/java'), includes: rootProject.ext.mluaCoreRuntimeSources))
    into file("${buildDir}/generated/root-java")
    doLast {
        rootProject.ext.filterMluaVersionMarkers(project, destinationDir, targetVer)
    }
}

task prepareTransformerSources(type: Sync) {
    from("${rootProject.projectDir}/modules/transformer/src/main/java") {
        include 'dev/mlua/transformer/MLuaInstrumentationBridge.java'
        include 'dev/mlua/transformer/MLuaMixinClassWriter.java'
        include 'dev/mlua/transformer/MLuaMixinTransformer.java'
    }
    into file("${buildDir}/generated/transformer-java")
}

sourceSets.main.java.setSrcDirs([
    file("${buildDir}/generated/prepareFabricProjectSources"),
    file("${buildDir}/generated/prepareFabricCommonVersionSources"),
    file("${buildDir}/generated/prepareFabricImplSources"),
    "${rootProject.projectDir}/modules/api/mlua-loader-api/src/main/java",
    "${rootProject.projectDir}/modules/api/mlua-mc-api/src/main/java",
    "${rootProject.projectDir}/modules/language/mlua-common/src/main/java",
    "${rootProject.projectDir}/modules/api/mlua-api/src/main/java",
    "${rootProject.projectDir}/modules/language/mlua-luaj/src/main/java",
    file("${buildDir}/generated/root-java"),
    file("${buildDir}/generated/transformer-java")
])

tasks.processResources.dependsOn prepareFabricProjectResources
tasks.compileJava.dependsOn tasks.prepareRootSources, tasks.prepareTransformerSources, prepareFabricProjectSources, prepareFabricCommonVersionSources, prepareFabricImplSources

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    if (!isUnobfuscated) mappings loom.officialMojangMappings()
    if (isUnobfuscated) {
        implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        // Keep the loader/API visible as Fabric mods in dedicated-server
        // DevLaunch even when official-mapped targets use plain implementation
        // dependencies for compilation.
        runtimeOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
        runtimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        // Loom's dedicated-server launch configuration does not always inherit
        // modImplementation dependencies when the project is launched directly.
        // Keep Fabric API on the server runtime classpath explicitly.
        modRuntimeOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    }
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'org.slf4j:slf4j-api:2.0.9'
    implementation 'com.google.code.gson:gson:2.10'
    if (!isUnobfuscated) compileOnly project(':mlua-api')
    compileOnly project(':mlua-loader-api')
    compileOnly project(':mlua-mc-api')
    compileOnly project(':mlua-common')
    compileOnly project(':mlua-luaj')
    implementation('org.apache.bcel:bcel:6.7.0')
    include('org.apache.bcel:bcel:6.7.0')
    include('org.apache.commons:commons-lang3:3.18.0')
}

// Fabric's dedicated-server DevLaunch must receive loader/API jars as
// explicit mod candidates. This is needed for every version target because
// Loom does not reliably propagate modRuntimeOnly into runServer.
tasks.withType(JavaExec).configureEach {
    if (name.toLowerCase().contains('run')) {
        doFirst {
            def remapClasspath = file('.gradle/loom-cache/remapClasspath.txt')
            def mods = remapClasspath.isFile() ? remapClasspath.getText('UTF-8')
                .split(java.util.regex.Pattern.quote(File.pathSeparator))
                .findAll { path ->
                    def normalized = path.replace('\\', '/')
                    normalized.contains('/net.fabricmc/fabric-loader/') || normalized.contains('/net.fabricmc.fabric-api/')
                }
                .join(File.pathSeparator) : ''
            if (mods.isBlank()) {
                def runtime = configurations.findByName('runtimeClasspath')
                if (runtime != null) {
                    mods = runtime.files
                        .findAll { file ->
                            def normalized = file.absolutePath.replace('\\', '/')
                            normalized.contains('/net.fabricmc/fabric-loader/') || normalized.contains('/net.fabricmc.fabric-api/')
                        }
                        .collect { it.absolutePath }
                        .join(File.pathSeparator)
                }
            }
            if (!mods.isBlank()) {
                systemProperty 'fabric.addMods', mods
                jvmArgs "-Dfabric.addMods=${mods}"
            }
        }
    }
}

// Also put the value on Loom's run configuration itself. Fabric Loom 1.8.x
// builds the DevLaunch command from this model and can ignore late JavaExec
// mutations for runServer.
def fabricServerModCandidates = providers.provider {
    def remapClasspath = file('.gradle/loom-cache/remapClasspath.txt')
    if (!remapClasspath.isFile()) return ''
    remapClasspath.getText('UTF-8')
        .split(java.util.regex.Pattern.quote(File.pathSeparator))
        .findAll { path ->
            def normalized = path.replace('\\', '/')
            normalized.contains('/net.fabricmc/fabric-loader/') || normalized.contains('/net.fabricmc.fabric-api/')
        }
        .join(File.pathSeparator)
}

loom.runs {
    server {
        def mods = fabricServerModCandidates.get()
        if (!mods.isBlank()) vmArg("-Dfabric.addMods=${mods}")
    }
}

processResources {
    configureMluaIcon(delegate)
    inputs.properties([
        version: project.version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_authors: mod_authors,
        mod_description: mod_description,
        minecraft_version: minecraft_version
    ])
    from("${rootProject.projectDir}/src/main/resources") {
        exclude 'META-INF/mods.toml'
        exclude 'mlua.forge.mixins.json'
        exclude 'mlua.mixins.json'
        exclude 'mlua.firstperson.mixins.json'
        exclude 'Icon.png'
    }
    if (!isUnobfuscated) {
        def yarnMappingsTiny = fileTree("${gradle.gradleUserHomeDir}/caches/fabric-loom/${minecraft_version}") {
            include '**/net.fabricmc.yarn.*-v2/mappings.tiny'
        }.files.find { it.isFile() }
        if (yarnMappingsTiny != null) {
            from(yarnMappingsTiny) {
                into 'mlua'
                rename { 'yarn-mappings.tiny' }
            }
        }
    }
    filesMatching('fabric.mod.json') {
        expand(version: project.version, mod_id: mod_id, mod_name: mod_name,
            mod_authors: mod_authors, mod_description: mod_description,
            mod_license: mod_license,
            minecraft_version: minecraft_version)
    }
}
