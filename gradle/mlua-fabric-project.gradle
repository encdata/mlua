''' + text.substring(dataStart)
                    }
                    if (source.name == 'MLuaKeybindController.java') text = text.replace('new KeyMapping(label, keyType(key), keyValue(key), category)', 'new KeyMapping(label, keyType(key), keyValue(key), KeyMapping.Category.MISC)').replace('options.setKey(keyMapping, key(keyMapping));', 'keyMapping.setKey(key(keyMapping));')
                    if (source.name == 'MLuaCommandContext.java') text = text.replace('current.displayClientMessage(Component.literal(args.checkjstring(2)), false);', 'current.sendSystemMessage(Component.literal(args.checkjstring(2)));')
                    if (source.name == 'MLuaCommandRegistry.java') text = text.replace('player.displayClientMessage(Component.literal("[MLua] Client command failed: " + e.getMessage()), false);', 'player.sendSystemMessage(Component.literal("[MLua] Client command failed: " + e.getMessage()));').replace('.dimension().location()', '.dimension().identifier()')
                    if (source.name == 'MLuaBlockCallbackDispatcher.java') text = text.replace('.isClientSide', '.isClientSide()').replace('.dimension().location()', '.dimension().identifier()')
                    if (source.name == 'MLuaCommandRegistry.java') text = text.replace('source.hasPermission(definition.permission())', 'dev.mlua.mc.impl.command.MLuaPermissionAdapter.hasPermission(source, definition.permission())')
