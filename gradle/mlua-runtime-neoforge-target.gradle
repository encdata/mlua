                    if (source.name == 'MCPlayerListImpl.java') text = text.replace('return inner.isOp(profile);', 'return inner.isOp(new net.minecraft.server.players.NameAndId(profile));')
                    if (source.name == 'MCSoundEventImpl.java') text = text.replace('inner.getLocation()', 'inner.location()')
                    if (source.name == 'MCLevelImpl.java') text = text.replace('return inner.getDayTime();', 'return inner.getOverworldClockTime();')
                    if (source.name == 'MLuaClientParticleManager.java') text = text
                        .replace('BuiltInRegistries.BLOCK.get(blockId)', 'BuiltInRegistries.BLOCK.getValue(blockId)')
                        .replace('new ItemStack(BuiltInRegistries.ITEM.get(itemId))', 'BuiltInRegistries.ITEM.getValue(itemId)')
                    source.setText(text.replace('GuiGraphicsExtractorExtractor', 'GuiGraphicsExtractor'), 'UTF-8')
                }
            }
        }
    }
}

neoForge {
    version = neo_forge_version
    mods {
        mlua {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_forge_version}"
    implementation project(':mlua-core')
    implementation('org.apache.bcel:bcel:6.7.0') {
        transitive = false
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn prepareRuntimeNeoForgeResources
    from(rootProject.file('src/main/resources/Icon.png')) {
        into ''
        rename { 'icon.png' }
    }
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_forge_version: neo_forge_version,
            neo_forge_version_range: neo_forge_version_range,
            neo_loader_version_range: neo_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Automatic-Module-Name': 'mlua',
                'Agent-Class': 'dev.mlua.agent.MLuaMixinAgent',
                'Premain-Class': 'dev.mlua.agent.MLuaMixinAgent',
                'Can-Retransform-Classes': 'true',
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor': mod_authors
        ])
    }
    exclude 'dev/mlua/MLuaMod.class'
    exclude 'dev/mlua/common/mixin/**'
    exclude 'dev/mlua/transformer/**'
    exclude 'org/luaj/**'
    exclude 'org/apache/bcel/**'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}
