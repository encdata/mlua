buildscript {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${providers.gradleProperty('loomVersion').get()}"
    }
}

def loomPluginId = providers.gradleProperty('loomVersion').get().startsWith('1.15')
    ? 'net.fabricmc.fabric-loom' : 'fabric-loom'
apply plugin: loomPluginId

version = '1.0.0'
group = 'dev.mlua.ci'

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    def modDependencyConfiguration = providers.gradleProperty('minecraftVersion').get().startsWith('26.')
        ? 'implementation' : 'modImplementation'
    minecraft "com.mojang:minecraft:${providers.gradleProperty('minecraftVersion').get()}"
    if (!providers.gradleProperty('minecraftVersion').get().startsWith('26.')) {
        mappings loom.officialMojangMappings()
    }
    add(modDependencyConfiguration, "net.fabricmc:fabric-loader:${providers.gradleProperty('fabricLoaderVersion').get()}")
    add(modDependencyConfiguration, "net.fabricmc.fabric-api:fabric-api:${providers.gradleProperty('fabricApiVersion').get()}")
    add(modDependencyConfiguration, files('run/mods/mlua.jar'))
}

loom {
    runs {
        client {
            runDir 'run'
        }
        server {
            runDir 'run'
            programArgs '--nogui'
        }
    }
    mods {
        mlua_ci_smoke { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.property 'minecraftVersion', providers.gradleProperty('minecraftVersion').get()
    filesMatching('fabric.mod.json') {
        expand minecraftVersion: providers.gradleProperty('minecraftVersion').get()
    }
}
