name: Build and boot packaged Minecraft

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }} / ${{ matrix.loader }} (Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - target: '1.20.1'
            loader: fabric
            java: '21'
            gradle: '8.14.3'
          - target: '1.20.1'
            loader: forge
            java: '17'
            gradle: '8.10.2'
          - target: '1.21.1'
            loader: fabric
            java: '21'
            gradle: '8.14.3'
          - target: '1.21.1'
            loader: forge
            java: '21'
            gradle: '8.10.2'
          - target: '1.21.1'
            loader: neoforge
            java: '21'
            gradle: '9.2.1'
          - target: '26.1'
            loader: fabric
            java: '25'
            gradle: '9.2.1'
          - target: '26.1'
            loader: neoforge
            java: '25'
            gradle: '9.2.1'
          - target: '26.1.1'
            loader: fabric
            java: '25'
            gradle: '9.2.1'
          - target: '26.1.2'
            loader: fabric
            java: '25'
            gradle: '9.2.1'
          - target: '26.1.2'
            loader: neoforge
            java: '25'
            gradle: '9.2.1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build and validate the packaged mod JAR
        run: >-
          gradle --no-daemon --stacktrace
          -PmluaTarget=${{ matrix.target }}
          -PmluaLoader=${{ matrix.loader }}
          build

      - name: Upload Java regression test reports
        if: failure() && matrix.target == '1.20.1' && matrix.loader == 'forge'
        uses: actions/upload-artifact@v4
        with:
          name: java-regression-test-reports
          path: mlua-runtime/1.20.1/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 5

      - name: Upload packaged mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: mlua-${{ matrix.loader }}-${{ matrix.target }}
          path: build/loader-jars/*.jar
          if-no-files-found: error
          retention-days: 2

  run-client:
    name: Boot packaged ${{ matrix.target }} / ${{ matrix.loader }} client and server (Windows)
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - target: '1.20.1'
            loader: fabric
            java: '21'
            gradle: '8.14.3'
            loaderVersion: '0.16.10'
            fabricApi: '0.92.9+1.20.1'
            loom: '1.11.8'
          - target: '1.20.1'
            loader: forge
            java: '17'
            gradle: '8.10.2'
            forgeVersion: '47.2.0'
            forgeLoaderRange: '[47,)'
          - target: '1.21.1'
            loader: fabric
            java: '21'
            gradle: '8.14.3'
            loaderVersion: '0.16.14'
            fabricApi: '0.116.13+1.21.1'
            loom: '1.11.8'
          - target: '1.21.1'
            loader: forge
            java: '21'
            gradle: '8.10.2'
            forgeVersion: '52.1.14'
            forgeLoaderRange: '[52,)'
          - target: '1.21.1'
            loader: neoforge
            java: '21'
            gradle: '9.2.1'
            neoForgeVersion: '21.1.228'
          - target: '26.1'
            loader: fabric
            java: '25'
            gradle: '9.2.1'
            loaderVersion: '0.19.3'
            fabricApi: '0.154.2+26.1.2'
            loom: '1.15.4'
          - target: '26.1'
            loader: neoforge
            java: '25'
            gradle: '9.2.1'
            neoForgeVersion: '26.1.2.6-beta'
          - target: '26.1.1'
            loader: fabric
            java: '25'
            gradle: '9.2.1'
            loaderVersion: '0.19.3'
            fabricApi: '0.154.2+26.1.2'
            loom: '1.15.4'
          - target: '26.1.2'
            loader: fabric
            java: '25'
            gradle: '9.2.1'
            loaderVersion: '0.19.3'
            fabricApi: '0.154.2+26.1.2'
            loom: '1.15.4'
          - target: '26.1.2'
            loader: neoforge
            java: '25'
            gradle: '9.2.1'
            neoForgeVersion: '26.1.2.6-beta'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: mlua-${{ matrix.loader }}-${{ matrix.target }}
          path: client-smoke/mod

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Install Mesa software OpenGL renderer
        uses: f3d-app/install-mesa-windows-action@0bf56c0087f284825523b99b5a5320cb17ac6f43
        with:
          path: ${{ env.JAVA_HOME }}/bin
          version: 23.3.5

      - name: Force software OpenGL rendering
        shell: pwsh
        run: |
          'GALLIUM_DRIVER=llvmpipe' >> $env:GITHUB_ENV
          'LIBGL_ALWAYS_SOFTWARE=1' >> $env:GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Prepare isolated test mod with the packaged MLua JAR
        id: prepare
        shell: pwsh
        run: pwsh -File .github/scripts/prepare-packaged-smoke.ps1
        env:
          MLUA_LOADER: ${{ matrix.loader }}
          MLUA_TARGET: ${{ matrix.target }}
          MLUA_JAVA_VERSION: ${{ matrix.java }}
          MLUA_GRADLE_VERSION: ${{ matrix.gradle }}
          MLUA_LOADER_VERSION: ${{ matrix.loaderVersion }}
          MLUA_FABRIC_API_VERSION: ${{ matrix.fabricApi }}
          MLUA_LOOM_VERSION: ${{ matrix.loom }}
          MLUA_FORGE_VERSION: ${{ matrix.forgeVersion }}
          MLUA_FORGE_LOADER_RANGE: ${{ matrix.forgeLoaderRange }}
          MLUA_NEOFORGE_VERSION: ${{ matrix.neoForgeVersion }}

      - name: Boot Minecraft client with the packaged MLua JAR
        shell: pwsh
        working-directory: client-smoke/${{ matrix.loader }}
        run: |
          $gradleArgs = @('--no-daemon', '--stacktrace', "-PminecraftVersion=${{ matrix.target }}", "-PjavaVersion=${{ matrix.java }}")
          if ('${{ matrix.loader }}' -eq 'fabric') {
            $gradleArgs += @("-PfabricLoaderVersion=${{ matrix.loaderVersion }}", "-PfabricApiVersion=${{ matrix.fabricApi }}", "-PloomVersion=${{ matrix.loom }}")
          } elseif ('${{ matrix.loader }}' -eq 'forge') {
            $gradleArgs += @("-PforgeVersion=${{ matrix.forgeVersion }}", "-PforgeLoaderRange=${{ matrix.forgeLoaderRange }}")
          } else {
            $gradleArgs += "-PneoForgeVersion=${{ matrix.neoForgeVersion }}"
          }
          & ../../.github/scripts/run-minecraft-smoke.ps1 `
            -Task runClient `
            -GradleArgs $gradleArgs `
            -BootMarker 'MLUA_PACKAGED_CLIENT_BOOT_OK' `
            -RequiredMarker @('MLUA_RUNTIME_BOOTSTRAP_OK', 'MLUA_CI_CLIENT_SERVICE_SCRIPT_OK', 'MLUA_CI_TASK_LIMITS_OK', 'MLUA_CI_NESTED_TASK_SCHEDULE_OK', 'MLUA_CI_ANIMATION_API_OK', 'MLUA_CI_NATIVE_SCREEN_PENDING_OK', 'MLUA_CI_NATIVE_SCREEN_TICK_OK', 'MLUA_CI_CLOSED_SCREEN_CONTROLS_OK', 'MLUA_CI_SERVICE_PARITY_OK', 'MLUA_CI_REGISTRY_PROPERTIES_OK', 'MLUA_CI_DYNAMIC_REGISTRY_ENTRY_OK') `
            -LogFile 'client-smoke.log' `
            -TimeoutSeconds 180

      - name: Upload client logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: client-logs-${{ matrix.loader }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/client-smoke/**/*.log*
            ${{ github.workspace }}/client-smoke/**/crash-reports/*.txt
          if-no-files-found: ignore
          retention-days: 5

      - name: Boot dedicated server with the packaged MLua JAR
        if: ${{ always() && !cancelled() }}
        shell: pwsh
        working-directory: client-smoke/${{ matrix.loader }}
        run: |
          $gradleArgs = @('--no-daemon', '--stacktrace', "-PminecraftVersion=${{ matrix.target }}", "-PjavaVersion=${{ matrix.java }}")
          if ('${{ matrix.loader }}' -eq 'fabric') {
            $gradleArgs += @("-PfabricLoaderVersion=${{ matrix.loaderVersion }}", "-PfabricApiVersion=${{ matrix.fabricApi }}", "-PloomVersion=${{ matrix.loom }}")
          } elseif ('${{ matrix.loader }}' -eq 'forge') {
            $gradleArgs += @("-PforgeVersion=${{ matrix.forgeVersion }}", "-PforgeLoaderRange=${{ matrix.forgeLoaderRange }}")
          } else {
            $gradleArgs += "-PneoForgeVersion=${{ matrix.neoForgeVersion }}"
          }
          & ../../.github/scripts/run-minecraft-smoke.ps1 `
            -Task runServer `
            -GradleArgs $gradleArgs `
            -BootMarker 'MLUA_PACKAGED_SERVER_BOOT_OK' `
            -RequiredMarker @('MLUA_RUNTIME_BOOTSTRAP_OK', 'MLUA_SCRIPT_MIXIN_HOOK_OK', 'MLUA_EMPTY_STACK_ISOLATION_OK', 'MLUA_CI_SERVER_SERVICE_SCRIPT_OK', 'MLUA_CI_REGISTRY_PROPERTIES_OK', 'MLUA_CI_DYNAMIC_REGISTRY_ENTRY_OK') `
            -LogFile 'server-smoke.log' `
            -TimeoutSeconds 600

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.loader }}-${{ matrix.target }}
          path: |
            ${{ github.workspace }}/client-smoke/**/*.log*
            ${{ github.workspace }}/client-smoke/**/crash-reports/*.txt
          if-no-files-found: ignore
          retention-days: 5
