name: Compile and test Java targets

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Minecraft target to validate
        type: choice
        options:
          - 1.20.1
          - 1.21.1
          - 26.1
        default: 1.20.1
        required: true
      check:
        description: Run a compile or the target's Java tests
        type: choice
        options:
          - compile
          - test
        default: compile
        required: true

permissions:
  contents: read

jobs:
  compile:
    name: ${{ matrix.target }} / Fabric
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - target: 1.20.1
            java: '21'
          - target: 1.21.1
            java: '21'
          - target: 26.1
            java: '25'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile or run tests
        run: >-
          sh gradlew --no-daemon
          --max-workers=1
          -PmluaTarget=${{ matrix.target }}
          -PmluaLoader=fabric
          :fabric:${{ matrix.target }}:compileJava

  compile-selected:
    name: ${{ inputs.target }} / Fabric
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.target == '26.1' && '25' || '21' }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile or run tests
        run: >-
          sh gradlew --no-daemon
          --max-workers=1
          -PmluaTarget=${{ inputs.target }}
          -PmluaLoader=fabric
          :fabric:${{ inputs.target }}:${{ inputs.check == 'test' && 'test' || 'compileJava' }}
