plugins {
    id 'base'
}

apply from: rootProject.file('gradle/mlua-targets.gradle')
apply from: rootProject.file('gradle/mlua-version-marker-filter.gradle')

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}

def targetConfig = loadMluaTargetConfig()
validateMluaTargetConfig(targetConfig)
def documentationOnly = providers.gradleProperty('mluaDocsOnly').isPresent()
def requestedLoader = providers.gradleProperty('mluaLoader').orNull
def activeTargets = selectMluaBuildTargets(targetConfig, providers.gradleProperty('mluaTarget').orNull, documentationOnly)
def allLoaderProjects = activeTargets.collectMany { target ->
    def loaders = requestedLoader == null ? target.loaders : target.loaders.findAll { it == requestedLoader }
    loaders.collect { loader -> [loader: loader, target: target.minecraft, path: ":${loader}:${target.minecraft}"] }
}.findAll { findProject(it.path) != null }

def collectLoaderJars = tasks.register('collectLoaderJars', Copy) {
    allLoaderProjects.each { loaderProject ->
        // Some modern Loom/NeoForge projects expose only `jar`, while older
        // Fabric projects expose `remapJar`. Resolve whichever task actually
        // exists instead of assuming every target has remapJar.
        def loader = project(loaderProject.path)
        def remapJar = loader.tasks.findByName('remapJar')
        def reobfJar = loader.tasks.findByName('reobfJar')
        def archiveTask = remapJar ?: loader.tasks.named('jar').get()
        // ForgeGradle's reobfJar rewrites the jar archive but does not declare
        // copyable task outputs, so Copy.from(reobfJar) becomes NO-SOURCE.
        // Depend on reobfuscation, then collect the archive task's actual file.
        if (remapJar != null) {
            dependsOn remapJar
        } else if (reobfJar != null) {
            dependsOn reobfJar
        } else {
            dependsOn archiveTask
        }
        from(archiveTask.archiveFile) {
            into ''
        }
    }
    into(layout.buildDirectory.dir('loader-jars'))
}

tasks.named('assemble').configure {
    allLoaderProjects.each { loaderProject ->
        dependsOn project(loaderProject.path).tasks.named('assemble')
    }
}

tasks.named('build').configure {
    allLoaderProjects.each { loaderProject ->
        dependsOn project(loaderProject.path).tasks.named('build')
    }
    finalizedBy collectLoaderJars
}

def validateLoaderArtifacts = tasks.register('validateLoaderArtifacts') {
    dependsOn collectLoaderJars
    doLast {
        def json = new groovy.json.JsonSlurper()
        def outputDir = layout.buildDirectory.dir('loader-jars').get().asFile
        def manifest = []
        allLoaderProjects.each { loaderProject ->
            def artifact = new File(outputDir, "mlua-${loaderProject.loader}-${loaderProject.target}-${mod_version}.jar")
            if (!artifact.isFile() || artifact.length() < 100_000) {
                throw new GradleException("Missing or suspiciously small loader artifact: ${artifact}")
            }
            def entries = classEntries(artifact)
            if (!entries.contains('icon.png')) throw new GradleException("${artifact.name} is missing icon.png")
            def entrypointClass
            if (loaderProject.loader == 'fabric') {
                entrypointClass = 'dev/mlua/loader/impl/fabric/MLuaFabricMod.class'
            } else if (loaderProject.loader == 'forge') {
                entrypointClass = 'dev/mlua/MLuaMod.class'
            } else if (loaderProject.loader == 'neoforge' && loaderProject.target == '1.21.1') {
                entrypointClass = 'dev/mlua/MLuaMod.class'
            } else if (loaderProject.loader == 'neoforge') {
                entrypointClass = 'dev/mlua/runtime/neoforge/MLuaNeoForge26Mod.class'
            } else {
                throw new GradleException("No packaged entrypoint check for loader '${loaderProject.loader}'")
            }
            if (!entries.contains(entrypointClass)) {
                throw new GradleException("${artifact.name} is missing its ${loaderProject.loader} mod entrypoint ${entrypointClass}")
            }
            def earlyBootstrapPresent = new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                zip.getEntry('dev/mlua/common/mixin/MLuaEarlyMixinBootstrap.class') != null
            }
            if (!earlyBootstrapPresent) {
                throw new GradleException("${artifact.name} is missing the top-level early mixin bootstrap class")
            }
            [
                'dev/mlua/core/MLuaLogger.class',
                'dev/mlua/core/MLuaThreadHandoff.class',
                'dev/mlua/core/require/MLuaModuleCache.class',
                'dev/mlua/core/util/MLuaWeakIdentityMap.class'
            ].each { requiredClass ->
                if (!entries.contains(requiredClass)) {
                    throw new GradleException("${artifact.name} is missing required runtime class ${requiredClass}")
                }
            }
            if (!entries.contains('dev/mlua/agent/MLuaMixinAgent.class')) {
                throw new GradleException("${artifact.name} is missing dev/mlua/agent/MLuaMixinAgent.class")
            }
            if (loaderProject.loader != 'fabric') {
                def embeddedRuntimeValidation = new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                    def runtimeEntry = zip.getEntry('embedded/mlua/mlua-runtime.jar')
                    if (runtimeEntry == null) {
                        throw new GradleException("${artifact.name} is missing embedded/mlua/mlua-runtime.jar")
                    }
                    new java.util.jar.JarInputStream(zip.getInputStream(runtimeEntry)).withCloseable { runtime ->
                        def runtimeEntries = [] as Set
                        java.util.jar.JarEntry entry
                        while ((entry = runtime.nextJarEntry) != null) {
                            if (!entry.isDirectory()) runtimeEntries.add(entry.name)
                        }
                        [classesPresent: runtimeEntries.containsAll([
                            'dev/mlua/core/MLuaLogger.class',
                            'dev/mlua/core/MLuaThreadHandoff.class',
                            'dev/mlua/core/require/MLuaModuleCache.class',
                            'dev/mlua/core/util/MLuaWeakIdentityMap.class',
                            'dev/mlua/agent/MLuaMixinAgent.class'
                        ]), agentClass: runtime.manifest?.mainAttributes?.getValue('Agent-Class')]
                    }
                }
                if (!embeddedRuntimeValidation.classesPresent) {
                    throw new GradleException("${artifact.name} embedded runtime is missing mlua-core classes")
                }
                if (embeddedRuntimeValidation.agentClass != 'dev.mlua.agent.MLuaMixinAgent') {
                    throw new GradleException("${artifact.name} embedded runtime is missing its MLua runtime agent manifest")
                }
            }
            if (loaderProject.loader == 'fabric') {
                def agentClass = new java.util.jar.JarFile(artifact).withCloseable { jar ->
                    jar.manifest?.mainAttributes?.getValue('Agent-Class')
                }
                if (agentClass != 'dev.mlua.agent.MLuaMixinAgent') {
                    throw new GradleException("${artifact.name} is missing its MLua runtime agent manifest")
                }
            }
            def mixinFiles = new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                zip.entries().findAll { it.name.endsWith('.mixins.json') }.collect { it.name }
            }
            def registeredMixinConfigs = new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                def registered = [] as Set
                if (loaderProject.loader == 'fabric') {
                    def metadata = zip.getEntry('fabric.mod.json')
                    if (metadata == null) throw new GradleException("${artifact.name} is missing fabric.mod.json")
                    def fabric = json.parseText(zip.getInputStream(metadata).getText('UTF-8'))
                    (fabric.mixins instanceof List ? fabric.mixins : []).each { entry ->
                        def config = entry instanceof Map ? entry.config : entry
                        if (config instanceof String && !config.isBlank()) registered.add(config)
                    }
                } else if (loaderProject.loader == 'forge') {
                    def metadata = zip.getEntry('META-INF/mods.toml')
                    if (metadata == null) throw new GradleException("${artifact.name} is missing META-INF/mods.toml")
                    if (zip.getInputStream(metadata).getText('UTF-8').contains('mixinConfig=')) {
                        throw new GradleException("${artifact.name} must register service mixins through the embedded runtime manifest")
                    }
                    def manifestEntry = zip.getEntry('META-INF/MANIFEST.MF')
                    def forgeManifest = manifestEntry == null ? null
                        : new java.util.jar.Manifest(zip.getInputStream(manifestEntry))
                    def manifestConfigs = forgeManifest?.mainAttributes?.getValue('MixinConfigs')
                    if (manifestConfigs != null) {
                        manifestConfigs.split(',').each { config -> registered.add(config.trim()) }
                    }
                    def runtimeEntry = zip.getEntry('embedded/mlua/mlua-runtime.jar')
                    if (runtimeEntry == null) throw new GradleException("${artifact.name} is missing its embedded runtime JAR")
                    def runtimeManifest = new java.util.zip.ZipInputStream(zip.getInputStream(runtimeEntry)).withCloseable { runtimeZip ->
                        java.util.zip.ZipEntry runtimeFile
                        while ((runtimeFile = runtimeZip.nextEntry) != null) {
                            if (runtimeFile.name == 'META-INF/MANIFEST.MF') {
                                return new java.util.jar.Manifest(
                                    new java.io.ByteArrayInputStream(runtimeZip.readAllBytes()))
                            }
                        }
                        null
                    }
                    def runtimeConfigs = runtimeManifest?.mainAttributes?.getValue('MixinConfigs')
                    if (runtimeConfigs != null) {
                        runtimeConfigs.split(',').each { config -> registered.add(config.trim()) }
                    }
                } else if (loaderProject.loader == 'neoforge') {
                    def metadata = zip.getEntry('META-INF/neoforge.mods.toml')
                    if (metadata == null) throw new GradleException("${artifact.name} is missing META-INF/neoforge.mods.toml")
                    def text = zip.getInputStream(metadata).getText('UTF-8')
                    def modsHeader = text.indexOf('[[mods]]')
                    def firstMixinHeader = text.indexOf('[[mixins]]')
                    if (modsHeader < 0 || firstMixinHeader < 0 || firstMixinHeader > modsHeader
                        || text.contains('mixinConfig=')) {
                        throw new GradleException("NeoForge artifacts must declare mixin tables before [[mods]]")
                    }
                    def matcher = text =~ /(?m)^config\s*=\s*"([^"]+)"\s*$/
                    while (matcher.find()) registered.add(matcher.group(1))
                }
                registered
            }
            def unregisteredMixinConfigs = mixinFiles.findAll { !registeredMixinConfigs.contains(it) }
            if (!unregisteredMixinConfigs.isEmpty()) {
                throw new GradleException("${artifact.name} packages unregistered mixin configs: ${unregisteredMixinConfigs.sort()}")
            }
            mixinFiles.each { mixinPath ->
                def mixins = new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                    json.parseText(zip.getInputStream(zip.getEntry(mixinPath)).getText('UTF-8'))
                }
                def pkg = mixins.package ? mixins.package + '.' : ''
                (mixinLists(mixins) ?: []).each { mixinName ->
                    def classEntry = (pkg + mixinName).replace('.', '/') + '.class'
                    if (!entries.contains(classEntry)) throw new GradleException("${artifact.name} declares missing mixin ${classEntry}")
                }
            }
            manifest << [loader: loaderProject.loader, minecraft: loaderProject.target, file: artifact.name,
                         bytes: artifact.length(), sha256: sha256(artifact)]
        }
        def manifestFile = layout.buildDirectory.file('loader-jars/manifest.json').get().asFile
        manifestFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(manifest)) + System.lineSeparator()
    }
}

ext.mixinLists = { Map mixins ->
    ['mixins', 'client', 'server'].collectMany { key -> (mixins[key] instanceof List ? mixins[key] : []) }
}
ext.sha256 = { File file ->
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    file.withInputStream { input ->
        byte[] buffer = new byte[8192]
        int read
        while ((read = input.read(buffer)) > 0) digest.update(buffer, 0, read)
    }
    digest.digest().collect { String.format('%02x', it) }.join()
}
ext.classEntries = { File artifact ->
    def entries = [] as Set
    new java.util.zip.ZipFile(artifact).withCloseable { zip ->
        zip.entries().each { entry ->
            entries.add(entry.name)
            if (!entry.isDirectory() && entry.name.endsWith('.jar')) {
                new java.util.jar.JarInputStream(zip.getInputStream(entry)).withCloseable { nested ->
                    java.util.jar.JarEntry nestedEntry
                    while ((nestedEntry = nested.nextJarEntry) != null) {
                        if (!nestedEntry.isDirectory()) entries.add(nestedEntry.name)
                    }
                }
            }
        }
    }
    entries
}

tasks.named('build').configure { finalizedBy validateLoaderArtifacts }
