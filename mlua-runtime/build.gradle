plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'org.spongepowered.mixin' version '0.7.+'
}

ext.mluaRuntimeTargetVersion = providers.gradleProperty('default_minecraft_target').get()

apply from: rootProject.file('gradle/mlua-runtime-target.gradle')
